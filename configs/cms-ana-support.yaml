name: prod_analysis

global:
  TRAINED_ON: "CMS analysis HELP "  

locations_of_secrets:
  - ~/.a2rchi-secrets/api_tokens
  - ~/.a2rchi-secrets/salts_and_internal_passwords  

chains:
  input_lists:  
    - configs/cms-ana.list

  chain:
    MODEL_NAME: HuggingFaceOpenLLM
    CONDENSE_MODEL_NAME: HuggingFaceOpenLLM
    MODEL_CLASS_MAP:
      HuggingFaceOpenLLM:
        kwargs:
          base_model: "Qwen/Qwen2.5-14B-Instruct-1M"
          quantization: True
  prompts:
    CONDENSING_PROMPT: configs/prompts/condense.prompt  
    MAIN_PROMPT: configs/prompts/cms-ana.prompt  
    SUMMARY_PROMPT: configs/prompts/summary.prompt  

interfaces:
  chat_app:
    PORT: 50000
    EXTERNAL_PORT: 50000
    HOSTNAME: "submit76.mit.edu"
  
utils:
  embeddings:
    EMBEDDING_NAME: HuggingFaceEmbeddings
    EMBEDDING_CLASS_MAP:
      HuggingFaceEmbeddings:
        similarity_score_reference: 10